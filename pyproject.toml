[tool.poetry]
name = "SeSePerson"
version = "0.0.0"
description = "A highly intelligent AI"
authors = ["coming <kangming06@hotmail.com>"]
readme = "README.md"
license = "GPL-3.0"
repository="https://github.com/wellcoming/SeSePerson"


[[tool.poetry.source]]
name = "tsinghua-mirror"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
priority = "primary"


[tool.poetry.dependencies]
python = ">=3.10,<4.0"
nonebot2 = {extras = ["fastapi"], version = "^2.4.1"}
nonebot-adapter-onebot = "^2.4.6"
tortoise-orm = "^0.24.0"
pillow = "^11.1.0"
pydantic = "^2.10.6"
pydantic-yaml = "^1.4.0"
aiohttp = "^3.11.11"
langchain = "^0.3.17"
langchain-openai = "^0.3.3"
langgraph = "^0.2.69"
langsmith = "^0.3.4"
nonebot-plugin-apscheduler = "^0.5.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
